# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-egf-swupdate"
BBFILE_PATTERN_meta-egf-swupdate = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-egf-swupdate = "11"

LAYERDEPENDS_meta-egf-swupdate = "core swupdate"
LAYERSERIES_COMPAT_meta-egf-swupdate = "scarthgap"
