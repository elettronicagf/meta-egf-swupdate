# save only swupdate related variables in environment
# IMPORTANT: CONFIG_ENV_OFFSET needs to be redefined here, because configuration process
#            removes it from starting configuration (ENV_IS_NOWHERE), and fragment is added
#            doing a make oldconfig (see u-boot-configure.inc).
#            make oldconfig needs also CONFIG_SYS_MMC_ENV_PART, but it is not used because
#            CONFIG_USE_ENV_MMC_PARTITION is not set
CONFIG_ENV_IS_IN_MMC=y
CONFIG_ENV_OFFSET=0x700000
CONFIG_SYS_MMC_ENV_DEV=2
CONFIG_SYS_MMC_ENV_PART=0
# CONFIG_USE_ENV_MMC_PARTITION is not set
# CONFIG_ENV_MMC_USE_DT is not set
CONFIG_ENV_WRITEABLE_LIST=y
CONFIG_ENV_APPEND=y